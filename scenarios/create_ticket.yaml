id: create_ticket
role: ticket_agent
input: "Create a ticket in the DEMO project titled 'Fix login bug'"
expected_tool_calls:
  - list_projects
  - create_ticket
success_criteria: >
  The agent verifies the DEMO project exists via list_projects before
  calling create_ticket — it does not assume the project key is valid.
expected_output_pattern: "DEMO-\\d+"
