[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-eval-harness"
version = "0.1.0"
description = "A multi-agent LLM eval harness, built from scratch to learn how scenario specs, trajectory scoring, handoff/context-loss detection, and LLM-judge calibration actually work."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness", "harness.evaluators"]

[tool.pytest.ini_options]
pythonpath = ["."]
